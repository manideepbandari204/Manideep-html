<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Bank App</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
</head>

<body class="bg-danger">
    <header class="bg-warning">
        <center>
            <h1>
                <Font color="orange">Manideep</Font>
                <Font color="blue">Bank</Font>
            </h1>
            <a href="index.html">About Bank</a> |
            <a href="customerRegistrationForm.html">Customer Registration Form</a> |
            <a href="EMI Calculator.html">EMI Calculator</a> |
            <a href="Open New Bank Account.html">Open New Bank Account</a> |
            <a href="Customer Profile Update.html">Customer Profile Update</a> |
            <a href="Internet Bank Login.html">Internet Banking Login</a> |
            <a href="Credit Card Application.html">Credit Card Application</a> |
            <a href="Loan Eligibility Check.html">Loan Eligibility Check</a> |
            <a href="Branch feedback.html">Branches Feedback</a>
        </center>
    </header>
    <hr>
    <main>
        <br>
        <center>
            <div class="panel panel-default" style="display:inline-block; max-width:600px; width:100%;">
                <div class="container-fluid">
                    <form action="acbserver" method="post">
                        <table class="table table-striped table-bordered table-hover">
                            <caption>
                                <h2 class="text-primary">Branch feedback</h2>
                            </caption>
                            <tr>
                                <td><label for="name">Name</label></td>
                                <td><input type="text" id="name" name="name" class="form-control"></td>
                            </tr>
                            <tr>
                                <td><label for="mail">Email</label></td>
                                <td><input type="email" id="mail" name="mail" class="form-control"></td>
                            </tr>
                            <tr>
                                <td><label for="branch">Branch</label></td>
                                <td>
                                    <select id="branch" name="branch" class="form-control">
                                        <option>Hyderabad</option>
                                        <option>Chennai</option>
                                        <option>Bangalore</option>
                                    </select>
                                </td>
                            </tr>
                            <tr>
                                <td><label for="visitDate">Visit Date</label></td>
                                <td>
                                    <input type="date" id="visitDate" name="visitDate" class="form-control">
                                </td>
                            </tr>
                            <tr>
                                <td><label for="rating">Rating</label></td>
                                <td>
                                    <label class="radio-inline"><input type="radio" name="rating" value="excellent" id="excellent"> Excellent</label>
                                    <label class="radio-inline"><input type="radio" name="rating" value="good" id="good"> Good</label>
                                    <label class="radio-inline"><input type="radio" name="rating" value="average" id="average"> Average</label>
                                </td>
                            </tr>
                            <tr>
                                <td><label for="services">Service Used</label></td>
                                <td>
                                    <label class="checkbox-inline"><input type="checkbox" name="services" value="atm" id="atm"> ATM</label>
                                    <label class="checkbox-inline"><input type="checkbox" name="services" value="loan" id="loan"> Loan</label>
                                    <label class="checkbox-inline"><input type="checkbox" name="services" value="account" id="account"> Account</label>
                                </td>
                            </tr>
                            <tr>
                                <td><label for="suggestions">Suggestions</label></td>
                                <td><textarea id="suggestions" name="suggestions" class="form-control"></textarea></td>
                            </tr>
                            <tr>
                                <td colspan="2" align="center">
                                    <input type="submit" value="Submit" class="btn btn-primary">
                                    <input type="reset" value="Reset" class="btn btn-success">
                                </td>
                            </tr>
                        </table>
                    </form>
                </div>
            </div>
        </center>
        <br><br><br><br><br>
    </main>
    <hr>
    <footer>
        <h3>
            <center>
                <Font color="green">copyright@manideep</Font>
            </center>
        </h3>
    </footer>
</body>

</html>
